site_name: passmcp
site_description: Onboard, test and diagnose remote MCP servers end to end.
site_url: https://satellion.com/passmcp/docs/
copyright: '<a href="https://sebastienrousseau.com/" rel="author">&copy; 2026 Sebastien Rousseau</a>'
repo_url: https://github.com/sebastienrousseau/passmcp
repo_name: sebastienrousseau/passmcp
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: public
strict: true

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    # Three states rather than two: a reader whose system is dark should
    # not have to click to get the dark manual.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow the system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light

extra_css:
  - assets/brand.css

repo_url: https://github.com/sebastienrousseau/passmcp
repo_name: sebastienrousseau/passmcp
edit_uri: edit/main/docs/

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight

nav:
