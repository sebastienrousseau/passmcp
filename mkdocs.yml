  - Getting started: getting-started.md
  - Credentials: credentials.md
  - The nine phases: phases.md
  - Servers that are programs: stdio.md
  - Every check: checks.md
  - The stateless revision: stateless.md
  - Reports and telemetry: reports.md
  - Reading the evidence: evidence.md
  - Acceptance policies: policy.md
  - Signing attestations: signing.md
  - Running passmcp in CI: ci.md
  - Fleets and drift: fleet.md
  - Discovering endpoints: discovery.md
  - A2A Agent Cards: a2a.md
  - OCSF export: ocsf.md
  - Compliance evidence:
      - SOC 2: compliance/soc2.md
      - ISO/IEC 27001: compliance/iso27001.md
      - "passmcp's Statement of Applicability": compliance/iso27001-soa.md
      - GDPR: compliance/gdpr.md
      - EU Cyber Resilience Act: compliance/cra.md
  - Configuration: configuration.md
  - Library use: library.md
  - Coming from another tool:
