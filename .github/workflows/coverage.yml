name: Coverage Badge

# Publishes the statement coverage main measured as a shields.io endpoint
# document at https://sebastienrousseau.com/passmcp/coverage.json, which the
# README's coverage badge renders. The number is computed here, on every push
# to main, and never typed by hand.
#
# This is the repository's only GitHub Pages deployment: the manual is
# published by satellion.github.io, not from here (see docs.yml).
#
# sebastienrousseau.com is behind a Cloudflare edge cache that keeps what it
# fetched, a 404 included, whatever the Pages origin's max-age=0 says. A
# deploy therefore does not reach the badge by itself: the last job purges
# the one URL when a purge token is configured, then reads the document back
# and says whether the badge shows what was measured (DEVELOPMENT.md,
# Coverage).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CGO_ENABLED: '0'

jobs:
  measure:
    name: Measure coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      badge: ${{ steps.badge.outputs.json }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      # The same exclusion as the Coverage Gate in ci.yml: the entry point is
      # a two-line main() with no behaviour of its own.
      - name: Write coverage.json
        id: badge
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          go test -count=1 -coverprofile=coverage.out ./...
          mkdir -p site
          go run ./scripts/coveragebadge -profile coverage.out -exclude /cmd/passmcp/main.go > site/coverage.json
          cat site/coverage.json
          echo "json=$(cat site/coverage.json)" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy
    needs: measure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Least privilege: this job holds no GitHub token scope at all. The purge
  # token is a Cloudflare credential scoped to purging this zone's cache.
  published:
    name: Badge is published
    needs: [measure, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      URL: https://sebastienrousseau.com/passmcp/coverage.json
      WANT: ${{ needs.measure.outputs.badge }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
      CF_ZONE: ${{ vars.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Purge the edge cache
        run: |
          set -euo pipefail
          if [ -z "${CF_TOKEN}" ] || [ -z "${CF_ZONE}" ]; then
            echo "::notice::CLOUDFLARE_PURGE_TOKEN or CLOUDFLARE_ZONE_ID is not set; not purging"
            exit 0
          fi
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
            --data "{\"files\":[\"${URL}\"]}" | jq -e '.success' >/dev/null

      # A deploy that the edge never serves is the failure this job exists
      # to catch. It fails only when a purge was possible; without one it
      # warns, because the fix is then a setting, not a rerun.
      - name: Read the badge back
        run: |
          set -euo pipefail
          got=""
          for _ in $(seq 1 12); do
            got=$(curl -fsS "${URL}" 2>/dev/null || true)
            if [ "${got}" = "${WANT}" ]; then
              echo "published: ${got}"
              exit 0
            fi
            sleep 10
          done
          msg="${URL} serves '${got:-an error}', not '${WANT}'"
          if [ -n "${CF_TOKEN}" ] && [ -n "${CF_ZONE}" ]; then
            echo "::error::${msg}"
            exit 1
          fi
          echo "::warning::${msg}; the edge cache holds an older response. Set CLOUDFLARE_PURGE_TOKEN and CLOUDFLARE_ZONE_ID (DEVELOPMENT.md, Coverage)."
