# OpenSSF Scorecard: self-assessment for this repository.
# Runs weekly and on push to main. Results visible in the GitHub Security tab.

name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions: {}

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The authoritative runs are push-to-main and the weekly schedule; on a
    # pull request the SARIF upload is skipped anyway, so a PR run is
    # advisory and advisory checks should not block.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # PAT with read access to administrative settings so checks such as
          # Branch-Protection can be evaluated. Falls back to the default
          # token if the secret is unset.
          repo_token: ${{ secrets.SCORECARD_TOKEN }}

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
