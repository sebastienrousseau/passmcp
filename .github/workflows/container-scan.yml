name: Container Security

# hadolint on every change to the Dockerfile, and a Trivy CVE scan of the
# published image after each release. Findings surface in the Security tab
# as Code Scanning results.

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.goreleaser.yaml'
      - '.github/workflows/container-scan.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Published image version without the leading v'
        required: true
        type: string

permissions: {}

jobs:
  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Run hadolint on the Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint.sarif

      - name: Upload hadolint SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: hadolint.sarif
          category: hadolint

  trivy-image:
    name: Trivy image scan
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve immutable release tag
        id: image
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG:-${MANUAL_VERSION}}"
          version="${version#v}"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          echo "tag=${version}" >> "${GITHUB_OUTPUT}"

      - name: Run Trivy on the published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'ghcr.io/sebastienrousseau/passmcp:${{ steps.image.outputs.tag }}'
          format: 'sarif'
          output: 'trivy.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: trivy.sarif
          category: trivy-image
