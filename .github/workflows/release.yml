name: Release

on:
  push:
    tags:
      - 'v*'
  # Dry-run mode. Release machinery is the code least exercised before it
  # matters most: a tag push is a one-shot, and a config error there means a
  # broken or half-published release. This builds every artefact, runs every
  # before-hook and packages every format, then stops short of publishing,
  # signing and attesting, so new machinery can be proven before its first
  # real use. Artefacts are uploaded for inspection.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and package without publishing"
        type: boolean
        default: true

permissions: {}

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # true for a manual dry run, false for a tag push.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      CGO_ENABLED: '0'
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Guards a real publish: the ref must be a semver tag, that tag must
      # point at this commit, the commit must be on main, and the CHANGELOG
      # must carry a heading for the version being released.
      #
      # Skipped on a dry run, which has no tag at all.
      - name: Verify release ref
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          test "$(git rev-list -n 1 "${GITHUB_REF_NAME}")" = "${GITHUB_SHA}"
          bash scripts/verify-release-versions.sh "${GITHUB_REF_NAME}"

      - name: Test release source
        env:
          GOTOOLCHAIN: auto
        run: go test -count=1 ./...

      # Docker toolchain for the goreleaser dockers: + docker_manifests:
      # sections. QEMU handles arm64 emulation on the amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: env.DRY_RUN != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # syft, for the goreleaser `sboms:` block; cosign, for `signs:` and
      # `docker_signs:`. Neither is preinstalled on the runner. Keyless
      # signing uses the same OIDC token the provenance attestation does, so
      # there is no long-lived signing key to leak.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          # A dry run builds and packages everything, then stops: --snapshot
          # skips the publish, sign and announce pipes and does not need a tag.
          #
          # It no longer skips docker. It did, which made it useless for the
          # one thing a dry run is for: a Dockerfile or an image config that
          # cannot build is a failure that otherwise appears only after the
          # tag exists, which is the expensive order. buildx builds without
          # pushing while --skip=publish is set, so this costs a few minutes
          # and nothing else.
          args: ${{ env.DRY_RUN == 'true' && 'release --clean --snapshot --skip=publish,sign,announce' || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Upload dry-run artefacts for inspection
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dry-run-dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
            dist/homebrew/
          if-no-files-found: error
          retention-days: 7

      # The release page a tag would publish, composed from the artefacts
      # built above and printed rather than published. The version is the
      # newest CHANGELOG heading; a tag that does not exist yet is placed at
      # this commit for GitHub's generated notes.
      - name: Compose the release page (dry run)
        if: env.DRY_RUN == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v$(sed -n 's/^## \[\([0-9][0-9.]*\)\].*/\1/p' CHANGELOG.md | head -1)"
          assets=(dist/checksums.txt)
          while read -r _ name; do
            if [ -f "dist/${name}" ]; then
              assets+=("dist/${name}")
            else
              echo "::notice::${name} is not in dist/; it is left off the dry-run page"
            fi
          done < dist/checksums.txt
          go run ./scripts/releasepage -name passmcp -tag "${tag}" -target "${GITHUB_SHA}" "${assets[@]}"

      # Provenance comes first, before any packaging step can fail.
      #
      # In v0.0.1 it did not, and the cost was exactly what the comment on
      # the `brew` job below promises will not happen: a packaging step
      # referencing a path goreleaser stopped writing failed the job, and
      # took attestation down with it. The release was published with its
      # binaries, checksums and cosign signatures and without its
      # provenance. Ordering, not intent, is what makes that promise true.

      # SLSA build provenance for every artefact goreleaser emitted, in one
      # shot through the checksums file. Users verify with
      # `gh attestation verify <file> --owner sebastienrousseau`.
      - name: Attest release artifacts
        id: attest
        if: env.DRY_RUN != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      # Attach the provenance bundle to the release itself, so whoever has
      # the tarball can verify its provenance without knowing the
      # attestation API exists. The .intoto.jsonl name is the convention
      # tooling looks for.
      - name: Publish provenance alongside the release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          if [ -z "${BUNDLE}" ] || [ ! -f "${BUNDLE}" ]; then
            echo "::error::attestation step produced no bundle at '${BUNDLE}'"
            exit 1
          fi
          cp "${BUNDLE}" "${RUNNER_TEMP}/checksums.txt.intoto.jsonl"
          gh release upload "${GITHUB_REF_NAME}" \
            "${RUNNER_TEMP}/checksums.txt.intoto.jsonl" --clobber

      # OpenVEX for dependency vulnerabilities that do not affect passmcp, as
      # the EU Cyber Resilience Act asks a security update to state. The
      # document says `not_affected` and why (not imported, or no reachable
      # symbol); a vulnerability passmcp does reach is `affected` and fails
      # the security workflow long before a tag. Attached only when there
      # is something to say: an empty VEX document is noise.
      - name: Attach an OpenVEX statement for unaffecting advisories
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOTOOLCHAIN: auto
          GOBIN: ${{ runner.temp }}/gobin
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "${GOBIN}/govulncheck" -format json ./... > "${RUNNER_TEMP}/vuln.json"
          go run ./scripts/cra/main.go vex --in "${RUNNER_TEMP}/vuln.json" \
            --product "pkg:golang/satellion.com/passmcp@${GITHUB_REF_NAME}" \
            --out "${RUNNER_TEMP}/passmcp.openvex.json"
          if python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if any(s["status"]=="not_affected" for s in d.get("statements") or []) else 1)' "${RUNNER_TEMP}/passmcp.openvex.json"; then
            gh release upload "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/passmcp.openvex.json" --clobber
          else
            echo "govulncheck reported no dependency vulnerability to state as not_affected; no VEX document attached"
          fi

      # The published-release audit: every installable artefact has its
      # CycloneDX SBOM and the release carries SLSA provenance. Read back
      # from the release as published, not from dist/, so it proves what a
      # user can download.
      - name: Audit the published release assets
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./scripts/cra/main.go release-assets --tag "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}"

      # The release page in the family layout (AGENTS.md in ~/Code, §3):
      # title "passmcp X.Y.Z", the highlights from docs/releases/, GitHub's
      # generated change list, the SHA-256 of every asset attached, and the
      # Full Changelog link. It runs after every upload, so the checksums
      # cover the provenance bundle and the VEX document too, and it reads
      # the page back and fails unless GitHub shows what it composed.
      - name: Publish the release page
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./scripts/releasepage -name passmcp -tag "${GITHUB_REF_NAME}" -publish

      # The cask goreleaser generated, handed to the `brew` job below as an
      # artefact rather than regenerated there, so what reaches the tap is
      # byte-for-byte what goreleaser produced from the release's own
      # checksums. `homebrew_casks` writes to Casks/, not Formula/ — the
      # path this step used until v0.0.1 was the one `brews:` wrote to.
      - name: Carry the Homebrew cask to the publishing job
        if: env.DRY_RUN != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-cask
          path: dist/homebrew/Casks/passmcp.rb
          if-no-files-found: error
          retention-days: 1

  # The Homebrew tap is published in its own job, after the release has
  # succeeded. It used to carry continue-on-error so a package host being
  # unreachable could not cost a release its artefacts, signatures or
  # attestations — but that is now guaranteed by ordering instead: every
  # release upload and the attestation happen in the job before this one.
  #
  # So this job failing costs the tap and nothing else, and it should say
  # so. A token that can push a branch but not open a pull request would
  # otherwise publish a green release with a tap that was never updated. A
  # job that cannot fail is a job whose result nobody reads.
  brew:
    name: Publish the Homebrew cask
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Fetch the generated cask
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-cask
          path: cask

      - name: Open and merge the tap pull request
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN}" ]]; then
            # Loud, not quiet. Reporting success without publishing is how a
            # tap goes stale for months.
            echo "::error::HOMEBREW_TAP_TOKEN is not set; the cask will not be updated" >&2
            exit 1
          fi

          # A cask opens `cask "passmcp" do`; a formula opened `class passmcp`.
          # Asserting the shape catches a goreleaser change that silently
          # swaps one for the other before it reaches anybody's `brew`.
          test -s cask/passmcp.rb
          grep -q '^cask "passmcp" do' cask/passmcp.rb

          tap="sebastienrousseau/homebrew-tap"
          branch="passmcp-${VERSION}"

          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${tap}.git" tap
          cd tap
          git config user.name "goreleaserbot"
          git config user.email "bot@goreleaser.com"

          mkdir -p Casks
          cp ../cask/passmcp.rb Casks/passmcp.rb

          # Staged, then compared against the index.
          #
          # `git diff --quiet -- <path>` ignores untracked files, so the
          # first publish of a cask the tap has never held reads as "no
          # change" and the job reports success having pushed nothing.
          # That is what happened on the first real release, and it is the failure
          # the comment on this job warns about: reporting success without
          # publishing is how a tap goes stale for months.
          git add Casks/passmcp.rb
          if git diff --cached --quiet; then
            echo "cask already matches ${VERSION}; nothing to publish"
            exit 0
          fi

          git switch -c "${branch}"
          git add Casks/passmcp.rb
          git commit -m "passmcp ${VERSION}"
          git push origin "${branch}"

          gh pr create --repo "${tap}" --head "${branch}" --base main \
            --title "passmcp ${VERSION}" \
            --body "Generated by goreleaser from the checksums of the signed ${VERSION} release."
          gh pr merge --repo "${tap}" "${branch}" --squash --delete-branch

  satellites:
    name: Notify the satellites
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # docs/ecosystem.md, rule 2: propagation is automatic. Each lockstep
      # repository receives the version and the image digest it must pin,
      # and does the rest itself. GITHUB_TOKEN cannot dispatch to another
      # repository, so this needs a fine-grained token with contents:write
      # on the satellites — and is loud when it is missing, for the reason
      # the tap job is.
      - name: Fire repository_dispatch at every lockstep satellite
        env:
          GH_TOKEN: ${{ secrets.SATELLITE_DISPATCH_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::SATELLITE_DISPATCH_TOKEN is not set; the satellites will not learn about ${VERSION}" >&2
            exit 1
          fi
          # The multi-arch manifest digest of the image this release pushed.
          # Fetched to a file and parsed from it: a download piped into an
          # interpreter is what Scorecard's Pinned-Dependencies check reads
          # as download-then-run, whatever the bytes are.
          curl -fsSL "https://ghcr.io/token?scope=repository:sebastienrousseau/passmcp:pull" -o "${RUNNER_TEMP}/ghcr-token.json"
          token=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["token"])' "${RUNNER_TEMP}/ghcr-token.json")
          digest=$(curl -fsSI -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/sebastienrousseau/passmcp/manifests/${VERSION#v}" \
            | tr -d '\r' | awk 'tolower($1) == "docker-content-digest:" { print $2 }')
          [[ -n "${digest}" ]] || { echo "::error::no image digest for ${VERSION#v} on ghcr.io" >&2; exit 1; }
          for repo in passmcp-action passmcp-server passmcp-reporting; do
            gh api --method POST "repos/sebastienrousseau/${repo}/dispatches" \
              -f event_type=passmcp-release \
              -f "client_payload[version]=${VERSION}" \
              -f "client_payload[image_digest]=${digest}"
            echo "dispatched passmcp-release ${VERSION} (${digest}) to ${repo}"
          done
