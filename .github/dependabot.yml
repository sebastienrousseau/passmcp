version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
  # The tools CI builds (govulncheck, gorelease), pinned in their own
  # module so they never enter passmcp's dependency graph. The tools are
  # the module's only purpose and every requirement is theirs, so all of
  # them are updated, indirect included, in one grouped pull request.
  - package-ecosystem: "gomod"
    directory: "/tools"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(tools)"
    allow:
      - dependency-type: "all"
    groups:
      tools:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns:
          - "*"
  # The Dockerfile pins its base by digest, which is correct, and means
  # nothing moves it unless something is watching.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"
