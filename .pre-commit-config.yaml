# Local mirrors of the cheap CI gates, so the red appears before the push
# rather than after it. Deliberately excludes the slow gates (race
# detector, full suite, fuzzing, goreleaser) — a pre-commit hook people
# disable because it takes a minute is worse than no hook.
#
#   pip install pre-commit && pre-commit install
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Licence texts, generated output and test fixtures are kept byte
      # for byte: a whitespace fix would make them differ from their
      # source, and some fixtures are streams of JSON documents, not one.
      - id: end-of-file-fixer
        exclude: &verbatim ^(LICENSE|LICENSES/.*|internal/web/dist/.*|.*/testdata/.*)$
      - id: trailing-whitespace
        exclude: *verbatim
        # Two trailing spaces are a Markdown line break (the README's FAQ).
        args: [--markdown-linebreak-ext=md]
      - id: check-merge-conflict
      # Kubernetes examples hold several documents in one file.
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
        exclude: *verbatim
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: [--ignore-words-list=intoto,unparseable,ndjson]
        exclude: ^(go\.sum$|.*\.har$|.*\.svg$)

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.18.1
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -l -w
        language: system
        types: [go]

      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false

      # Licence coverage is a property of the whole tree, so it runs once
      # rather than per file.
      - id: spdx
        name: SPDX headers
        entry: make spdx-check
        language: system
        pass_filenames: false
