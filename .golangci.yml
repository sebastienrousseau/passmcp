version: "2"
linters:
  default: standard
  enable:
    - revive
    # A tool that holds an operator's credentials and points them at servers
    # nobody vetted gets the security and correctness linters, not just the
    # standard set.
    - gosec
    - bodyclose
    - errorlint
    - nilerr
    - copyloopvar
    - makezero
    - rowserrcheck
    - noctx
    # contextcheck is deliberately absent: every phase derives its per-call
    # context through a closure over the phase context (pctx), and the
    # analyser cannot see through the closure, so it reports every derived
    # context as a new one. Per-file exclusions would hide real findings too.
    #
    # Complexity ceilings. The phases decide what the score says (ADR-0002),
    # and a verdict nobody can hold in their head is where a wrong pass
    # hides. maintidx folds Halstead volume, cyclomatic complexity and
    # length into one maintainability index.
    #
    # gocyclo, gocognit and funlen are set to the portfolio ceilings below
    # (10, 15, 60 lines). Code older than those ceilings exceeds them in
    # places, so `make lint` and CI run golangci-lint with these three
    # disabled and then scripts/complexity, which runs only them and
    # compares the result with .complexity-baseline: nothing new over a
    # ceiling, nothing recorded there gets worse, and the file only
    # shrinks. An editor running this file directly shows every offender.
    - gocyclo
    - gocognit
    - nestif
    - funlen
    - maintidx
  settings:
    gocyclo:
      min-complexity: 10
    gocognit:
      min-complexity: 15
    nestif:
      min-complexity: 5
    funlen:
      lines: 60
      statements: 50
    maintidx:
      under: 20
    revive:
      rules:
        - name: exported
          arguments: ["checkPrivateReceivers", "disableStutteringCheck"]
    gosec:
      excludes:
        # G104 duplicates errcheck, which is already in the standard set.
        - G104
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, revive, gosec, bodyclose, noctx]
      # A table-driven test is long by design; the ceilings are for code
      # that runs.
      - path: _test\.go
        linters: [gocyclo, gocognit, nestif, funlen, maintidx]
      # The hostile server exists to misbehave; its handlers are deliberate.
      - path: internal/hostile/
        linters: [gosec, errcheck, noctx]

# gofmt runs as its own CI step, but only in CI. Declaring it here too means
# `golangci-lint run` locally reports the same formatting the gate enforces,
# rather than passing clean and letting the push find it.
formatters:
  enable:
    - gofmt
